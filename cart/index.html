<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
</head>
<body>
    <header>
        <h1>Shop</h1>
        <p>Cart items: <span id="cart-count">0</span></p>
    </header>

    <h2>Products</h2>
    <ul id="product-list"></ul>

    <h2>Your cart</h2>
    <ul id="cart-list"></ul>
    <p>Total: KSh <span id="cart-total">0</span></p>
    <button type="button" id="clear-cart">Clear cart</button>

    <script src="cart.js"></script>
</body>
</html>
